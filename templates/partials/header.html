<header class="site-header">
  <div class="header-inner">
    <!-- Logo -->
    <a href="{site.url.relative}" class="header-logo" aria-label="Ditchbridge — accueil">
      <img src="{site.url.resolve('/images/logo_ditchbridge.png')}" alt="Ditchbridge" height="28" style="height:28px;width:auto;display:block;">
    </a>

    <!-- Mobile Menu Button -->
    <button id="mobile-menu-button" class="nav-item" aria-label="Menu">
      <span class="icon icon-menu"></span>
    </button>

    {#fragment id=menu}
    {@java.lang.String device = 'desktop'}
    <!-- Navigation -->
    <div class="{device == 'desktop' ? 'desktop-nav' : 'mobile-nav hidden'}">
      <nav>
        {#for item in site.data.navigation}
        <a href="{site.url.resolve(item.url)}" class="nav-item">
          {item.title}
        </a>
        {/for}
        {#for social in site.data.social??}
        <a href="{social.link}" class="nav-social" target="_blank" rel="noopener noreferrer" aria-label="{social.name}" title="{social.name}">
          <span class="icon icon-{social.icon}"></span>
          {#if device == 'mobile'}<span id="theme-text">{social.name}</span>{/if}
        </a>
        {/for}
      </nav>

      <!-- Language Switcher — single toggle button -->
      <button
        id="lang-switcher"
        class="lang-switcher"
        aria-label="Changer de langue / Switch language"
        title="Changer de langue"
        data-fr-root="{site.url.resolve('/')}"
        data-en-root="{site.url.resolve('/en/')}">
        <span id="lang-fr">FR</span>
        <span class="lang-sep" aria-hidden="true">/</span>
        <span id="lang-en">EN</span>
      </button>

      <!-- Theme Toggle -->
      <button class="nav-item theme-toggle" aria-label="Toggle theme">
        <span class="hidden toggle-light icon icon-sun"></span>
        <span class="hidden toggle-dark icon icon-moon"></span>
        {#if device == 'mobile'}<span class="theme-text">LIGHT MODE</span>{/if}
      </button>

      <!-- Social Icons -->
      <div class="header-social">
        <a href="#" class="header-social-link" aria-label="LinkedIn" title="Ditchbridge sur LinkedIn" target="_blank" rel="noopener noreferrer">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
          </svg>
        </a>
        <a href="https://github.com/kanedafromparis/fr-ditchbridge-www" class="header-social-link" aria-label="GitHub" title="Ditchbridge sur GitHub" target="_blank" rel="noopener noreferrer">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
          </svg>
        </a>
      </div>
    </div>
    {/fragment}
  </div>
  {#include $menu device='mobile'/}
</header>

<script>
(function() {
  var btn = document.getElementById('lang-switcher');
  var frEl = document.getElementById('lang-fr');
  var enEl = document.getElementById('lang-en');
  if (!btn || !frEl || !enEl) return;

  var path = window.location.pathname;

  // Base path from the data attribute rendered by Qute (e.g. "/fr-ditchbridge-www")
  var frRoot = btn.getAttribute('data-fr-root'); // e.g. "/fr-ditchbridge-www/"
  var base = frRoot.replace(/\/$/, '');           // e.g. "/fr-ditchbridge-www"

  // Local path relative to base
  var local = path.slice(base.length) || '/';

  var isEn = local.startsWith('/en/') || local === '/en';

  // Highlight current language
  if (isEn) {
    frEl.classList.remove('lang-active');
    enEl.classList.add('lang-active');
  } else {
    frEl.classList.add('lang-active');
    enEl.classList.remove('lang-active');
  }

  // On click: navigate to the same page in the other language
  btn.addEventListener('click', function() {
    var target;
    if (isEn) {
      // Go to FR equivalent
      var frLocal = local.replace(/^\/en\//, '/').replace(/^\/en$/, '/') || '/';
      target = base + frLocal;
    } else {
      // Go to EN equivalent
      target = base + '/en' + local;
    }
    window.location.href = target;
  });
})();
</script>
